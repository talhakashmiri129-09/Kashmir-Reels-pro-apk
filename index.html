<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .reel {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .icon-btn {
            background: rgba(0,0,0,0.4);
            border: none;
            color: white;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            left: 15px;
            z-index: 10;
        }
        .username {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .caption {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Leaf Icon -->
        <div class="header">🍁 Kashmir Reels</div>

        <!-- Reel 1 -->
        <div class="reel">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted playsinline></video>
            <div class="sidebar">
                <button class="icon-btn" onclick="alert('Liked!')">❤️</button>
                <button class="icon-btn" onclick="alert('Comments')">💬</button>
                <button class="icon-btn" onclick="alert('Shared!')">↗️</button>
            </div>
            <div class="footer">
                <div class="username">@kashmir_user</div>
                <div class="caption">Beautiful views of Kashmir! 🍁 #KashmirReels</div>
            </div>
        </div>

        <!-- Reel 2 -->
        <div class="reel">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted playsinline></video>
            <div class="sidebar">
                <button class="icon-btn" onclick="alert('Liked!')">❤️</button>
                <button class="icon-btn" onclick="alert('Comments')">💬</button>
                <button class="icon-btn" onclick="alert('Shared!')">↗️</button>
            </div>
            <div class="footer">
                <div class="username">@valley_boy</div>
                <div class="caption">Enjoying the weather 🍁</div>
            </div>
        </div>
    </div>

</body>
</html>
