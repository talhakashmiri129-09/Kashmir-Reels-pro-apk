<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Reels 🍁</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        /* Auth Screen Styling */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; }
        .auth-logo { font-size: 60px; margin-bottom: 10px; }
        .auth-box h1 { color: #ff3b5c; margin-bottom: 20px; font-size: 24px; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; }
        .auth-btn { width: 100%; padding: 12px; background: #ff3b5c; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .switch-text { margin-top: 15px; font-size: 13px; color: #888; cursor: pointer; }

        /* Main App Feed Styling */
        #main-app { display: none; height: 100vh; width: 100vw; position: relative; }
        .header { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 10; font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        .header span { color: #ff3b5c; margin: 0 10px; }

        .reels-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; }
        .reel-item { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }
        .reel-item video { height: 100%; width: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .video-info { position: absolute; bottom: 70px; left: 15px; z-index: 5; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .video-info h3 { font-size: 16px; margin-bottom: 5px; }
        .video-info p { font-size: 14px; color: #ddd; }

        .right-actions { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { background: rgba(0,0,0,0.4); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background-color: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 20; }
        .nav-item { color: #888; font-size: 14px; background: none; border: none; cursor: pointer; text-align: center; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .upload-label { background: #fff; color: #000; width: 45px; height: 30px; border-radius: 8px; font-weight: bold; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. ACCOUNT LOGIN / SIGNUP SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <div class="auth-logo">🍁</div>
            <h1 id="auth-title">Kashmir Reels</h1>
            <input type="email" id="email" class="auth-input" placeholder="Enter Email">
            <input type="password" id="password" class="auth-input" placeholder="Enter Password">
            <button class="auth-btn" onclick="handleAuth()">Continue to App</button>
            <p class="switch-text" onclick="toggleAuthMode()" id="switch-mode">Don't have an account? Sign Up</p>
        </div>
    </div>

    <!-- 2. MAIN TIKTOK FEED SCREEN -->
    <div id="main-app">
        <div class="header">
            Following | <span style="color:#fff;">For You</span> 🍁
        </div>

        <div class="reels-container" id="feed">
            <!-- Default Reel -->
            <div class="reel-item">
                <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted playsinline></video>
                <div class="video-info">
                    <h3>@kashmir_official</h3>
                    <p>Welcome to Kashmir Reels! 🍁 Swipe down for more.</p>
                </div>
                <div class="right-actions">
                    <button class="action-btn" onclick="alert('Liked! ❤️')">❤️</button>
                    <button class="action-btn" onclick="alert('Comments')">💬</button>
                    <button class="action-btn" onclick="alert('Shared!')">↗️</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="alert('Search Page')">🔍 Search</button>
            <label class="upload-label" for="videoUpload">+</label>
            <input type="file" id="videoUpload" accept="video/*" capture="environment" style="display: none;" onchange="uploadVideo(event)">
            <button class="nav-item" onclick="alert('User Profile Settings')">👤 Profile</button>
        </div>
    </div>

    <script>
        let isSignup = true;

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('auth-title').innerText = isSignup ? "Create Account" : "Login to Account";
            document.getElementById('switch-mode').innerText = isSignup ? "Already have an account? Login" : "Don't have an account? Sign Up";
        }

        function handleAuth() {
            const email = document.getElementById('email').value;
            if(!email) {
                alert('Please enter your email!');
                return;
            }
            // Transition from Auth to Main TikTok Feed App
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            alert('Welcome to Kashmir Reels, ' + email.split('@')[0] + '!');
        }

        function uploadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const feed = document.getElementById('feed');
                
                // Create new reel item dynamically
                const newItem = document.createElement('div');
                newItem.className = 'reel-item';
                newItem.innerHTML = `
                    <video src="${url}" loop autoplay muted playsinline></video>
                    <div class="video-info">
                        <h3>@my_account</h3>
                        <p>${file.name} 🍁 #KashmirReels</p>
                    </div>
                    <div class="right-actions">
                        <button class="action-btn" onclick="alert('Liked!')">❤️</button>
                        <button class="action-btn" onclick="alert('Comments')">💬</button>
                        <button class="action-btn" onclick="alert('Shared!')">↗️</button>
                    </div>
                `;
                feed.prepend(newItem);
                alert('Your video has been uploaded successfully to Kashmir Reels feed!');
            }
        }
    </script>

</body>
</html>
